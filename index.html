<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>西湖 801</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="西湖 801">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#d6eadb">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#d6eadb;overflow:hidden}
  body{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
  iframe{display:block;width:100%;height:100%;border:0;background:#f7f9f7}
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbxXXP40EGPnnBu8iOZlxSclCIWaG_teGaUe49-ZUWKjyDhZ2kr_5EyaqcRXBLEj4c4K/exec" title="西湖 801" allow="clipboard-write"></iframe>
<script>
// 幫 App 保存登入狀態，關掉再開也不會被登出
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.xh801 !== 1) return;
  var host = '';
  try { host = new URL(e.origin).hostname; } catch (_) { return; }
  if (!/\.googleusercontent\.com$/.test(host)) return;
  var P = 'xh801:';
  try {
    if (d.op === 'get') {
      var data = {};
      (d.keys || []).forEach(function (k) { var v = localStorage.getItem(P + k); if (v !== null) data[k] = v; });
      e.source.postMessage({ xh801: 1, op: 'data', data: data }, e.origin);
    } else if (d.op === 'set') {
      localStorage.setItem(P + d.k, String(d.v));
    } else if (d.op === 'del') {
      localStorage.removeItem(P + d.k);
    }
  } catch (err) {}
});
</script>
</body>
</html>
